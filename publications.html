<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="SNU AGN & Galaxy — Publications: peer-reviewed papers and preprints from the group.">
  <meta name="theme-color" content="#0a84ff">
  <title>SNU ECHOS — Publications</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      /* page background */
      --ink: #0b0f14;
      /* primary text on light */
      --ink-weak: #697582;
      /* secondary text on light */
      --bg-inv: #0b0f14;
      /* inverted background (dark sections) */
      --ink-inv: #f2f5f8;
      /* text on dark */
      --ink-inv-weak: #c8d0da;
      /* secondary on dark */
      --blue: #0a84ff;
      /* key accent */
      --blue-ink: #0056b8;
      /* pressed/active ink */
      --hairline: rgba(11, 15, 20, .12);
      --hairline-strong: rgba(11, 15, 20, .18);

      --font: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      --measure: 68ch;
      --step--1: 14px;
      --step-0: 17px;
      --step-1: clamp(20px, 2.2vw, 22px);
      --step-2: clamp(26px, 3.6vw, 32px);
      --step-3: clamp(34px, 5.2vw, 44px);

      --space-1: 8px;
      --space-2: 12px;
      --space-3: 18px;
      --space-4: 28px;
      --space-5: 44px;
      --space-6: 72px;
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;
      --elev: 0 6px 24px rgba(0, 0, 0, .08);

      --nav-h: 64px;
      /* fixed header height */
      --ham-btn: 40px;
      /* hamburger button size */
      --ham-w: 16px;
      /* bar length */
      --ham-h: 2px;
      /* bar thickness */
      --ham-gap: 6px;
      /* bar distance from center */
      --ham-nudge-y: -1px;
      /* optical center tweak */
    }

    /* ------------------ Base ------------------ */
    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--step-0);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-top: var(--nav-h);
      /* compensate for fixed header */
    }

    img {
      max-width: 100%;
      display: block
    }

    a {
      color: var(--blue);
      text-decoration: none
    }

    a:hover {
      color: var(--blue-ink)
    }

    .container {
      width: min(1140px, 92vw);
      margin-inline: auto
    }

    .wide {
      width: min(1320px, 94vw);
      margin-inline: auto
    }

    /* ------------------ Header / Nav (fixed + mobile) ------------------ */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      backdrop-filter: saturate(1.1) blur(10px);
      background: rgba(255, 255, 255, .85);
      border-bottom: 1px solid var(--hairline);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .06);
    }

    .nav-inner {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 800
    }

    .brand-mark {
      width: 120px;
      height: 60px;
      border-radius: 8px;
      background: none;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px;
      letter-spacing: .5px
    }

    .brand-text {
      letter-spacing: .2px
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px
    }

    .nav a {
      color: var(--ink);
      opacity: .9;
      padding: 8px 10px;
      border-radius: 10px
    }

    .nav a:hover {
      background: rgba(11, 15, 20, .05)
    }

    .nav .active {
      background: rgba(11, 15, 20, .06)
    }

    .nav-toggle {
      position: absolute;
      left: -9999px
    }

    .hamburger {
      width: var(--ham-btn);
      height: var(--ham-btn);
      position: relative;
      display: none;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: rgba(255, 255, 255, .8);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .hamburger span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ham-w);
      height: var(--ham-h);
      background: var(--ink);
      border-radius: 1px;
      transition: transform .22s ease, opacity .18s ease;
      transform: translate(-50%, calc(-50% + var(--ham-nudge-y)));
    }

    .hamburger span:nth-child(1) {
      transform: translate(-50%, calc(-50% - var(--ham-gap) + var(--ham-nudge-y)))
    }

    .hamburger span:nth-child(3) {
      transform: translate(-50%, calc(-50% + var(--ham-gap) + var(--ham-nudge-y)))
    }

    #nav-toggle:checked+.hamburger span:nth-child(1) {
      transform: translate(-50%, calc(-50% + var(--ham-nudge-y))) rotate(45deg)
    }

    #nav-toggle:checked+.hamburger span:nth-child(2) {
      opacity: 0
    }

    #nav-toggle:checked+.hamburger span:nth-child(3) {
      transform: translate(-50%, calc(-50% + var(--ham-nudge-y))) rotate(-45deg)
    }

    @media (max-width: 930px) {
      .hamburger {
        display: grid;
        place-content: center
      }

      .nav {
        position: fixed;
        top: calc(var(--nav-h) + 8px);
        left: 12px;
        right: 12px;
        display: none;
        flex-direction: column;
        gap: 0;
        background: rgba(255, 255, 255, .98);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        box-shadow: var(--elev);
        padding: 8px;
        max-height: calc(100vh - var(--nav-h) - 24px);
        overflow: auto;
        z-index: 998;
      }

      #nav-toggle:checked~.nav {
        display: flex
      }

      .nav a {
        display: block;
        padding: 14px 12px;
        margin: 2px 0
      }
    }

    /* ------------------ Page Intro ------------------ */
    .page-hero {
      padding: var(--space-6) 0 var(--space-4);
      border-bottom: 1px solid var(--hairline)
    }

    .page-hero h1 {
      font-size: var(--step-3);
      margin: 0 0 10px
    }

    .page-hero p {
      color: var(--ink-weak);
      margin: 0;
      max-width: var(--measure)
    }

    /* ------------------ Publication tiles ------------------ */
    .pubs {
      display: grid;
      gap: var(--space-4);
      margin: var(--space-5) auto;
    }

    .year {
      margin: var(--space-4) 0 var(--space-2);
      font-weight: 800;
      letter-spacing: .06em;
      color: #48515b;
      text-transform: uppercase;
      font-size: 13px;
    }

    /* Google Scholar Banner */
    .scholar-banner {
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: #f8fafc;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      transition: all .2s ease;
    }

    .scholar-banner:hover {
      border-color: var(--blue);
      background: #f0f7ff;
      box-shadow: 0 4px 16px rgba(10, 132, 255, .08);
    }

    .scholar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--blue-ink);
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      width: 100%;
    }

    .scholar-link:hover {
      color: var(--blue);
    }

    .scholar-icon {
      color: var(--blue);
      flex-shrink: 0;
    }

    .scholar-link .arrow {
      margin-left: auto;
      font-size: 16px;
      color: var(--blue);
      transition: transform .2s ease;
    }

    .scholar-banner:hover .arrow {
      transform: translate(2px, -2px);
    }

    .scholar-banner+.year {
      margin-top: var(--space-2);
    }

    .paper {
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      background: #fff;
      box-shadow: var(--elev);
      padding: clamp(18px, 3.6vw, 28px);
    }

    .paper h3 {
      margin: 0 0 6px;
      font-size: clamp(20px, 2.4vw, 22px);
      line-height: 1.35;
      color: var(--ink);
    }

    .meta {
      color: var(--ink-weak);
      margin: 0 0 12px;
      font-size: 15px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline-strong);
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
    }

    .btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: rgba(10, 132, 255, .2)
    }

    .btn.primary:hover {
      filter: brightness(1.05)
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      font-size: 12px;
      font-weight: 700;
      color: #2b2f35;
      background: #f8fafc;
      margin-right: 8px
    }

    /* Give the stack a little side breathing room on narrow laptops */
    .pubs {
      padding-inline: clamp(12px, 3vw, 24px);
    }

    @media (min-width:1200px) {
      .pubs {
        padding-inline: 0;
      }
    }

    /* Keep anchors visible below the fixed header if you add year anchors later */
    section[id] {
      scroll-margin-top: calc(var(--nav-h) + 12px);
    }

    .back-row {
      margin-top: var(--space-5);
      border-top: 1px solid var(--hairline);
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-weak);
      font-size: 10pt;
    }

    /* ------------------ Footer (dark, centered, two rows) ------------------ */
    .site-footer {
      background: var(--bg-inv);
      color: var(--ink-inv);
      border-top: 1px solid rgba(255, 255, 255, .08);
      margin-top: var(--space-6);
    }

    /* MATCH THE WIDE WIDTH (like your .wide sections) */
    .site-footer .footer-inner {
      width: min(1320px, 94vw);
      /* << widened from 1140px */
      margin-inline: auto;
      padding: 22px 0;
      display: grid;
      grid-template-rows: auto auto;
      /* brand row + microfooter row */
      row-gap: 16px;
    }

    /* Center the brand block itself */
    .foot-brand {
      display: flex;
      justify-content: center;
      /* centers the logo+text as a group */
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .foot-logo {
      width: 90px;
      height: auto;
      display: block;
    }

    .foot-brand-text address {
      margin: 6px 0;
      font-style: normal;
      color: var(--ink-inv-weak);
    }

    .site-footer a {
      color: var(--ink-inv);
      text-decoration: none;
      opacity: .95
    }

    .site-footer a:hover {
      opacity: 1
    }

    /* Microfooter: full width, centered items */
    .microfooter {
      border-top: 1px solid rgba(255, 255, 255, .12);
      padding-top: 10px;
      display: flex;
      width: 100%;
      /* ensure it spans the footer width */
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      color: var(--ink-inv-weak);
      text-align: center;
    }

    @media (max-width: 680px) {
      .foot-logo {
        width: 64px;
      }
    }

    /* ORCID icon + author layout */
    .meta .author {
      white-space: nowrap;
      margin-right: 6px
    }

    .orcid-icon {
      color: #A6CE39;
      /* official ORCID green */
      margin-left: 6px;
      font-size: 0.95em;
      vertical-align: 0.06em;
    }

    .meta .sep {
      margin-right: 6px
    }
  </style>
</head>

<body>
  <!-- ====================== NAV ====================== -->
  <div id="site-header"></div>
  <script src="nav.js"></script>

  <main>
    <!-- ====================== HERO ====================== -->
    <section class="page-hero">
      <div class="container">
        <h1>Publications</h1>
        <p>Peer-reviewed papers and preprints from the SNU AGN & Galaxy Research Group.</p>
      </div>
    </section>

    <!-- ====================== PUBLICATION LIST ====================== -->
    <div class="container pubs">

      <div class="scholar-banner">
        <a href="https://scholar.google.com/citations?hl=en&user=r0MiNlEAAAAJ&view_op=list_works&sortby=pubdate"
          target="_blank" rel="noopener" class="scholar-link">
          <svg class="scholar-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path
              d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M3.89 9.87L12 5.45l8.11 4.42L12 14.28 3.89 9.87z M12 16.27l-6-3.27v4.61c0 2.5 3.01 4.39 6 4.39s6-1.89 6-4.39v-4.61L12 16.27z" />
          </svg>
          <span>Prof. Woo's publication list (Google Scholar)</span>
          <span class="arrow">↗</span>
        </a>
      </div>

      <!-- Dynamically rendered publications list from publications_data.js -->
      <div id="publications-list"></div>
      <script src="publications_data.js"></script>
      <script src="publications.js"></script>

      <div class="back-row">
        <a href="index.html#main" class="link">← Back to Home</a>
      </div>
    </div>
  </main>

  <!-- ====================== FOOTER ====================== -->
  <div id="site-footer"></div>
  <script src="footer.js"></script>

  <!-- Auto-close mobile menu when a nav link is tapped -->
  <script>
    (function () {
      var t = document.getElementById('nav-toggle'); if (!t) return;
      document.querySelectorAll('#primary-nav a').forEach(function (a) {
        a.addEventListener('click', function () { t.checked = false; });
      });
    })();
  </script>
</body>

</html>
